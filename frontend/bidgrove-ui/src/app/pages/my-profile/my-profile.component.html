<div class="profile-container">
  <h3>My Profile</h3>

  <!-- Normal View -->
  <div class="card p-3 mt-3" *ngIf="!editMode && !passEditMode">
    <p><strong>Name:</strong> {{ profile.name }}</p>
    <p><strong>Username:</strong> {{ profile.username }}</p>
    <p><strong>Email:</strong> {{ profile.email }}</p>
    <p><strong>Phone:</strong> {{ profile.phone }}</p>
    <p><strong>Address:</strong> {{ profile.address }}</p>
    <button class="btn btn-primary mt-3" (click)="enableEdit()">
      Edit Profile
    </button>
    <button class="btn btn-warning mt-3 ms-2" (click)="enablePasswordEdit()">
      Change Password
    </button>
  </div>

  <!-- Edit Form -->
  <div class="card p-3 mt-3" *ngIf="editMode">
    <form (ngSubmit)="saveProfile()">
      <div class="mb-2">
        <label for="editName">Name</label>
        <input
          id="editName"
          class="form-control"
          [(ngModel)]="editForm.name"
          name="name"
        />
      </div>

      <div class="mb-2">
        <label for="editUsername">Username</label>
        <input
          id="editUsername"
          class="form-control"
          [(ngModel)]="editForm.username"
          name="username"
        />
      </div>

      <div class="mb-2">
        <label for="editEmail">Email</label>
        <input
          id="editEmail"
          class="form-control"
          [(ngModel)]="editForm.email"
          name="email"
        />
      </div>

      <div class="mb-2">
        <label for="editPhone">Phone</label>
        <input
          id="editPhone"
          class="form-control"
          [(ngModel)]="editForm.phone"
          name="phone"
        />
      </div>

      <div class="mb-2">
        <label for="editAddress">Address</label>
        <input
          id="editAddress"
          class="form-control"
          [(ngModel)]="editForm.address"
          name="address"
        />
      </div>

      <button class="btn btn-success mt-3" type="submit">Save</button>
      <button
        class="btn btn-secondary mt-3 ms-2"
        type="button"
        (click)="cancelEdit()"
      >
        Cancel
      </button>
    </form>
  </div>

  <!-- Change Password Form -->
  <div class="card p-3 mt-3" *ngIf="passEditMode">
    <form (ngSubmit)="changePassword()">
      <input
        class="form-control mb-2"
        type="password"
        [(ngModel)]="passForm.currentPassword"
        name="currentPassword"
        placeholder="Current Password"
      />
      <input
        class="form-control mb-2"
        type="password"
        [(ngModel)]="passForm.newPassword"
        name="newPassword"
        placeholder="New Password"
      />
      <input
        class="form-control mb-2"
        type="password"
        [(ngModel)]="passForm.confirmNewPassword"
        name="confirmNewPassword"
        placeholder="Confirm New Password"
      />

      <div *ngIf="successMessage" class="text-success">
        {{ successMessage }}
      </div>
      <div *ngIf="errorMessage" class="text-danger">{{ errorMessage }}</div>

      <button class="btn btn-success mt-2" type="submit">
        Change Password
      </button>
      <button
        class="btn btn-secondary mt-2 ms-2"
        type="button"
        (click)="cancelPasswordEdit()"
      >
        Cancel
      </button>
    </form>
  </div>
</div>
