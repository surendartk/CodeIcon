<app-navbar></app-navbar>

<div class="home-wrapper">
  <!-- Sidebar -->
  <div class="sidebar">
    <h3 class="sidebar-title">Menu</h3>
    <ul class="sidebar-menu">
      <li
        (click)="setActive('profile')"
        [class.active]="activeTab === 'profile'"
      >
        My Profile
      </li>
      <li
        (click)="setActive('products')"
        [class.active]="activeTab === 'products'"
      >
        My Products
      </li>
      <li (click)="setActive('orders')" [class.active]="activeTab === 'orders'">
        My Orders
      </li>
    </ul>
  </div>

  <div class="home-content">
    <h2 class="welcome-text">Welcome, {{ user?.username }}</h2>

    <!-- Load MyProfileComponent dynamically when 'profile' tab is active -->
    <ng-container *ngIf="activeTab === 'profile'">
      <app-my-profile></app-my-profile>
    </ng-container>

    <div *ngIf="activeTab === 'products'" class="content-card">
      <h4>My Products</h4>
      <p>Here you can see and manage your products.</p>
    </div>

    <div *ngIf="activeTab === 'orders'" class="content-card">
      <h4>My Orders</h4>
      <p>Check your orders and track delivery status.</p>
    </div>
  </div>
</div>
