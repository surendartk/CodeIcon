<div class="register-container">
  <h2>Register</h2>

  <form (ngSubmit)="register()">
    <div class="mb-2">
      <label for="username">Username</label>
      <input
        [(ngModel)]="registerForm.username"
        name="username"
        id="username"
        placeholder="Username"
        class="form-control"
        required
      />
    </div>

    <div class="mb-2">
      <label for="email">Email</label>
      <input
        [(ngModel)]="registerForm.email"
        name="email"
        id="email"
        placeholder="Email"
        class="form-control"
        required
      />
    </div>

    <div class="mb-2">
      <label for="password">Password</label>
      <input
        [(ngModel)]="registerForm.password"
        name="password"
        id="password"
        type="password"
        placeholder="Password"
        class="form-control"
        required
      />
    </div>

    <div class="mb-2">
      <label for="confirmPassword">Confirm Password</label>
      <input
        [(ngModel)]="registerForm.confirmPassword"
        name="confirmPassword"
        id="confirmPassword"
        type="password"
        placeholder="Confirm Password"
        class="form-control"
        required
      />
    </div>

    <button class="btn btn-success w-100" type="submit">Register</button>

    <!-- Backend message -->
    <div *ngIf="errorMessage || successMessage" class="mt-2">
      <div *ngIf="errorMessage" class="text-danger">{{ errorMessage }}</div>
      <div *ngIf="successMessage" class="text-success">
        {{ successMessage }}
      </div>
    </div>
  </form>

  <p class="mt-3">Already have an account? <a routerLink="/login">Login</a></p>
</div>
