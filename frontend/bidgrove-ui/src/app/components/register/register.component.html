<div class="register-container">
  <h2>Register</h2>

  <form #regForm="ngForm" (ngSubmit)="register()">

    <!-- USERNAME -->
    <div class="mb-2">
      <label for="username">Username</label>
      <input
        [(ngModel)]="registerForm.username"
        name="username"
        id="username"
        placeholder="Username"
        class="form-control"
        required
        #username="ngModel"
      />

      <small class="text-danger" *ngIf="username.invalid && username.touched">
        Username is required.
      </small>
    </div>

    <!-- EMAIL -->
    <div class="mb-2">
      <label for="email">Email</label>
      <input
        [(ngModel)]="registerForm.email"
        name="email"
        id="email"
        placeholder="Email"
        class="form-control"
        required
        email
        #email="ngModel"
      />

      <small class="text-danger" *ngIf="email.touched && email.invalid">
        <span *ngIf="email.errors?.['required']">Email is required.</span>
        <span *ngIf="email.errors?.['email']">Enter a valid email.</span>
      </small>
    </div>

    <!-- PASSWORD -->
    <div class="mb-2">
      <label for="password">Password</label>
      <input
        [(ngModel)]="registerForm.password"
        name="password"
        id="password"
        type="password"
        placeholder="Password"
        class="form-control"
        required
        minlength="8"
        (input)="checkPasswordStrength()"
        #password="ngModel"
      />

      <small class="text-danger" *ngIf="password.touched && password.invalid">
        <span *ngIf="password.errors?.['required']">Password is required.</span>
        <span *ngIf="password.errors?.['minlength']"
          >Minimum 8 characters required.</span
        >
      </small>

      <!-- Password Strength -->
      <div class="mt-1 password-strength" *ngIf="passwordStrength">
        Strength:
        <span [ngClass]="passwordStrengthClass">{{ passwordStrength }}</span>
      </div>
    </div>

    <!-- CONFIRM PASSWORD -->
    <div class="mb-2">
      <label for="confirmPassword">Confirm Password</label>
      <input
        [(ngModel)]="registerForm.confirmPassword"
        name="confirmPassword"
        id="confirmPassword"
        type="password"
        placeholder="Confirm Password"
        class="form-control"
        required
        (input)="validatePasswordMatch()"
        #confirmPassword="ngModel"
      />

      <small class="text-danger" *ngIf="passwordMismatch && confirmPassword.touched">
        Passwords do not match.
      </small>
    </div>

    <!-- SUBMIT BUTTON -->
    <button
      class="btn btn-success w-100"
      type="submit"
      [disabled]="regForm.invalid || passwordMismatch"
    >
      Register
    </button>

    <!-- Backend message -->
    <div *ngIf="errorMessage || successMessage" class="mt-2">
      <div *ngIf="errorMessage" class="text-danger">{{ errorMessage }}</div>
      <div *ngIf="successMessage" class="text-success">
        {{ successMessage }}
      </div>
    </div>
  </form>

  <p class="mt-3">Already have an account? <a routerLink="/login">Login</a></p>
</div>
