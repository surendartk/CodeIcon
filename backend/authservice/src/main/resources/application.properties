# ====================================================
# \uD83C\uDFF7\uFE0F  APPLICATION INFO
# ====================================================
spring.application.name=auth-service
server.port=8081

# ====================================================
# \uD83D\uDDC4\uFE0F  DATABASE CONFIGURATION (MySQL)
# ====================================================
spring.datasource.url=jdbc:mysql://localhost:3306/bidgrove_auth_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ====================================================
# \uD83E\uDDE9  JPA / HIBERNATE CONFIGURATION
# ====================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# ====================================================
# \uD83D\uDD10  JWT CONFIGURATION
# ====================================================
jwt.secret=zasxrdctfvybguhinjlmi5676879jhbe
jwt.expirationMs=3600000           
  # Access token valid for 1 hour
jwt.refreshExpirationMs=86400000     
# Refresh token valid for 1 day

